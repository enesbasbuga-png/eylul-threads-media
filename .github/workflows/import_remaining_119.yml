name: Import remaining 119 Eylul photos

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eylul-media-import
  cancel-in-progress: false

jobs:
  import-remaining:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install media import dependencies
        run: python -m pip install "gdown>=5,<6" "Pillow>=11,<13"
      - name: Import the remaining photos in restart-safe batches
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for start in 11 41 71 101; do
            count=30
            if [ "$start" -eq 101 ]; then count=29; fi
            echo "::group::Import images ${start}..$((start+count-1))"
            python scripts/import_drive.py --start "$start" --count "$count" --continue-on-error
            git add images/
            if ! git diff --cached --quiet; then
              git commit -m "Import Eylul photos ${start}..$((start+count-1))"
              git push origin HEAD:main
            fi
            echo '::endgroup::'
          done
          echo 'Checking all 129 images after preserving successful downloads'
          python scripts/check_imported.py
