name: Import Eylul photos from Google Drive

on:
  workflow_dispatch:
    inputs:
      start:
        description: "First photo number (1 to 129)"
        required: true
        default: "1"
        type: string
      count:
        description: "Number of photos to import in this run (1 to 50)"
        required: true
        default: "10"
        type: string

permissions:
  contents: write

concurrency:
  group: eylul-media-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image tools
        run: python -m pip install "gdown>=5,<6" "Pillow>=11,<13"
      - name: Download and prepare JPG images
        env:
          PHOTO_START: ${{ inputs.start }}
          PHOTO_COUNT: ${{ inputs.count }}
        run: python scripts/import_drive.py --start "$PHOTO_START" --count "$PHOTO_COUNT"
      - name: Commit public image copies
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/
          if git diff --cached --quiet; then
            echo "No new images to commit"
          else
            git commit -m "Import Eylul image range from shared Drive archive"
            git push origin HEAD:main
          fi
